name: athleteiq
description: AthleteIQ — training load, injury risk, and coach-approved recommendations.
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Firebase
  firebase_core: ^3.4.0
  firebase_auth: ^5.2.0
  cloud_firestore: ^5.4.0
  cloud_functions: ^5.1.0
  firebase_messaging: ^15.1.6

  # UI
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  intl: ^0.19.0

  # State management
  provider: ^6.1.2
  shared_preferences: ^2.3.3

  # Wearables — Apple HealthKit (iOS) / Health Connect (Android)
  health: ^13.3.1

  # Beta CSV training-log import
  file_picker: ^8.1.2

  # Coach weekly report share
  share_plus: ^10.1.4

  # Legal links (privacy policy, etc.)
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

# Regenerate store icons: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#2FE6B8"
  adaptive_icon_foreground: assets/branding/app_icon.png
  remove_alpha_ios: true

# Regenerate splash screens: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0B0D0C"
  image: assets/branding/splash_logo.png
  android_12:
    color: "#0B0D0C"
    image: assets/branding/splash_logo.png
  ios: true
  android: true
  web: false

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
